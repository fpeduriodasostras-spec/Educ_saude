<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do Medidor FPV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEEA; --surface:#FFFFFF; --surface2:#F6F7F4; --ink:#1D2630; --ink2:#4A5560; --muted:#6B757E;
  --line:#D3D8D2; --line2:#E4E7E2; --blue:#1F4E79; --blue2:#2D6AA3; --bluesoft:#DCEBFA;
  --yellow:#F2B705; --yellowsoft:#FFF2CC; --lanc:#FFFBB8; --red:#B3261E; --redsoft:#FBE3E1;
  --green:#2E7D4F; --greensoft:#D7EFDC; --orange:#9A5205; --topbar:#1D2630;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif; --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12171C; --surface:#1A2129; --surface2:#202832; --ink:#E8ECEF; --ink2:#B9C2CA; --muted:#8F99A2;
    --line:#2F3A45; --line2:#26303A; --blue:#7FB0E0; --blue2:#9CC3EA; --bluesoft:#1C2F44;
    --yellow:#F2B705; --yellowsoft:#3A3212; --lanc:#38361A; --red:#F08A82; --redsoft:#3D1F1D;
    --green:#7CCB9A; --greensoft:#1B3326; --orange:#F0A35A; --topbar:#0D1116;
  }
}
:root[data-theme="dark"]{
  --bg:#12171C; --surface:#1A2129; --surface2:#202832; --ink:#E8ECEF; --ink2:#B9C2CA; --muted:#8F99A2;
  --line:#2F3A45; --line2:#26303A; --blue:#7FB0E0; --blue2:#9CC3EA; --bluesoft:#1C2F44;
  --yellow:#F2B705; --yellowsoft:#3A3212; --lanc:#38361A; --red:#F08A82; --redsoft:#3D1F1D;
  --green:#7CCB9A; --greensoft:#1B3326; --orange:#F0A35A; --topbar:#0D1116;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--body)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--topbar);color:#fff}
.top-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:21px;line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:11.5px;color:#AEB8C1;margin-top:2px}
.topr{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.carimbo{font-size:12px;color:#C9D1D8}
.top select{background:#2A3542;color:#fff;border:1px solid #3A4654;border-radius:var(--r);padding:6px 8px;font-size:13px}
.btnt{border:1px solid #3A4654;background:#2A3542;color:#fff;border-radius:var(--r);padding:6px 10px;font-size:13px;cursor:pointer}
.btnt:hover{background:#34414F}
.stripe{height:5px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 10px,#1D2630 10px 20px)}
.sheets{display:flex;gap:3px;overflow-x:auto;padding:7px 16px 0;background:var(--surface2);border-bottom:1px solid var(--line);scrollbar-width:thin}
.sheets a{flex:none;padding:7px 12px 6px;border:1px solid var(--line);border-bottom:none;border-radius:6px 6px 0 0;background:var(--bg);color:var(--ink2);font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap}
.sheets a:hover{color:var(--ink)}
.sheets a.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 0 3px 0 var(--blue)}
.sheets a.main{font-weight:600}
.sheets a .n{font-size:11px;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
main{max-width:1440px;margin:0 auto;padding:16px 16px 80px}
h1{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1;margin:4px 0 4px}
h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0 0 8px}
h3{font-family:var(--display);font-weight:700;font-size:17px;margin:12px 0 6px}
.sub{color:var(--ink2);font-size:13px;margin:0 0 6px}
.fonte{font-size:12px;color:var(--muted);margin:0 0 14px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.fig{background:var(--surface);padding:10px 14px;border:none;text-align:left;color:var(--ink)}
button.fig{cursor:pointer} button.fig:hover{background:var(--bluesoft)}
.fig b{display:block;font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05}
.fig span{color:var(--ink2);font-size:12px}
.fig.ok b{color:var(--green)} .fig.at b{color:var(--orange)} .fig.ru b{color:var(--red)}
.prog{height:10px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:0 0 6px}
.prog i{display:block;height:100%;background:var(--green)}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:0 0 10px}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--line)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.in{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;font-size:14px;color:var(--ink)}
input.in{flex:1;min-width:200px}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme="dark"] .chip.on{color:#12171C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.on{color:#12171C}}
.hint{font-size:12px;color:var(--muted);margin:0 0 6px}
.notice{background:var(--yellowsoft);border:1px solid var(--yellow);border-radius:var(--r);padding:10px 12px;font-size:13px;margin-bottom:12px}
.notice.erro{background:var(--redsoft);border-color:var(--red)}
.tw{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th{position:sticky;top:0;z-index:2;background:var(--surface2);text-align:left;font-weight:600;color:var(--ink2);font-size:11.5px;letter-spacing:.02em;border-bottom:2px solid var(--ink);padding:7px 8px;white-space:nowrap}
th.so{cursor:pointer;user-select:none} th.so:hover{color:var(--ink)}
th.sug{background:var(--bluesoft)} th.lan{background:var(--lanc)}
td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:top;background:var(--surface)}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.grid td:first-child,.grid th:first-child{position:sticky;left:0;z-index:1;border-right:1px solid var(--line2)}
.grid th:first-child{z-index:3}
.grid tbody tr{cursor:pointer}
.grid tbody tr:hover td{filter:brightness(.97)}
tr.lancada td{background:var(--greensoft)}
tr.pulada td{color:var(--muted)}
td.cfalta{background:var(--yellowsoft);color:var(--orange);font-weight:600}
td.csug{background:var(--bluesoft)}
td.clan{background:var(--lanc);font-weight:600}
tr.lancada td.csug,tr.lancada td.clan{background:var(--greensoft)}
.lt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-width:200px;max-width:330px}
.md{min-width:150px;max-width:240px}
.lnk{border:none;background:none;padding:0;font:700 14px var(--display);color:var(--blue);cursor:pointer;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap}
.t-ok{background:var(--greensoft);color:var(--green)} .t-ex{background:var(--bluesoft);color:var(--blue)}
.t-pe{background:var(--yellowsoft);color:var(--orange)} .t-ru{background:var(--redsoft);color:var(--red)}
.t-cz{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.falta{color:var(--orange);font-weight:600} .pronta{color:var(--green);font-weight:600} .vazio{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:var(--r);cursor:pointer;font-weight:600;font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--yellow);border-color:var(--yellow);color:#1D2630}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
:root[data-theme="dark"] .btn.ok{color:#12171C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ok{color:#12171C}}
.btn.ghost{border-style:dashed;color:var(--ink2)}
.btn:disabled{opacity:.5;cursor:default}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.fotos{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.foto{position:relative;display:block;width:112px;height:112px;border:2px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface2);color:var(--muted);font-size:11px;cursor:pointer}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto.sel{border-color:var(--yellow);box-shadow:0 0 0 2px var(--yellow)}
.foto input{position:absolute;top:5px;left:5px;width:17px;height:17px}
.foto a,.foto .k{position:absolute;bottom:3px;background:rgba(0,0,0,.62);color:#fff;font-size:10.5px;padding:1px 6px;border-radius:4px;text-decoration:none}
.foto a{right:3px} .foto .k{left:3px}
.ov{position:fixed;inset:0;background:rgba(10,14,18,.5);z-index:60;display:flex;justify-content:flex-end}
.ov[hidden]{display:none}
.dw{background:var(--surface);width:min(860px,100%);height:100%;overflow-y:auto;padding:0 18px 40px;box-shadow:-8px 0 24px rgba(0,0,0,.2)}
.dwbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dwbar h2{margin:0;flex:1;min-width:220px}
.dw dl{display:grid;grid-template-columns:170px 1fr;gap:5px 12px;font-size:13px;margin:10px 0}
.dw dt{color:var(--ink2);font-weight:600;font-size:11.5px;letter-spacing:.02em;padding-top:2px}
.dw dd{margin:0;white-space:pre-wrap;word-break:break-word}
.bloco{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:12px 0;background:var(--surface)}
.bloco.falt{background:var(--yellowsoft);border-color:var(--yellow)}
.cands{display:grid;gap:6px;margin:8px 0}
.cand{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--bluesoft);cursor:pointer}
.cand input{margin-top:4px;width:16px;height:16px}
.cand .cd{font:600 16px var(--display);white-space:nowrap}
.cand .ds{font-size:12.5px;color:var(--ink2)}
.cand .uso{font-size:11.5px;color:var(--muted)}
.cand.sel{border-color:var(--blue);box-shadow:inset 3px 0 0 var(--blue)}
.addlist{display:grid;gap:4px;margin-top:6px}
.additem{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:var(--r);padding:8px 10px;cursor:pointer}
.additem:hover{border-color:var(--blue);background:var(--bluesoft)}
.additem .cd{font:600 15px var(--display)} .additem .ds{font-size:12px;color:var(--ink2);display:block}
.itemedit{border:1px solid var(--yellow);border-radius:var(--r);padding:10px;margin:8px 0;background:var(--lanc)}
.itemedit .tt{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.itemedit .tt .cd{font:700 17px var(--display)}
.itemedit .ds{font-size:12.5px;color:var(--ink2);margin:2px 0 8px}
.tape{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tape input{flex:1;min-width:170px;border:2px solid var(--ink);border-radius:var(--r);padding:9px 10px;font:600 17px var(--display);letter-spacing:.02em;background:var(--surface);color:var(--ink)}
.tape .res{font:700 24px var(--display);min-width:90px;text-align:right}
.tape .res.bad{color:var(--red);font-size:14px;font-family:var(--body);font-weight:600}
.memblk{border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden;background:var(--surface)}
.memblk .hd{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;padding:8px 12px;background:var(--surface2);border-bottom:1px solid var(--line)}
.memblk .hd b{font:700 16px var(--display)}
.memblk .tot{padding:6px 12px;text-align:right;font-weight:600;border-top:1px solid var(--line)}
.relcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:10px}
.relcard .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.relcard .ref{font:700 19px var(--display)}
.mini{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.mini img{width:70px;height:52px;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:var(--surface2)}
.login{max-width:380px;margin:9vh auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px}
.login h1{margin-bottom:2px} .login label{display:block;font-size:12.5px;color:var(--ink2);margin:12px 0 4px}
.login input{width:100%}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:13.5px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.empty{padding:24px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:640px){h1{font-size:24px}.fig b{font-size:23px}.dw{padding:0 12px 40px}.dw dl{grid-template-columns:1fr;gap:0}.dw dt{margin-top:8px}.tw{max-height:none}.carimbo{display:none}.foto{width:96px;height:96px}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">PAINEL DO MEDIDOR<small id="brandsub">FP Vieira Engenharia · Educação FP.094</small></div>
    <div class="topr" id="topr"></div>
  </div>
  <div class="stripe"></div>
  <nav class="sheets" id="sheets" aria-label="Abas do painel"></nav>
</header>
<main id="app"><div class="empty">Carregando…</div></main>
<div class="ov" id="ov" hidden><div class="dw" id="dw" role="dialog" aria-modal="true" aria-labelledby="dwt"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";
/* PAINEL DO MEDIDOR — versão CONECTADA (Vercel).
   Lê as O.S. direto do banco (os_campo) e grava os lançamentos nas tabelas da 0012
   (medicao, medicao_os, medicao_lancamento, contrato_item). Login = o mesmo do app.
   As regras de quem entra na medição são as da Planilha Mestra (gerar_mestra.py), aqui em JS.
   Cores da Mestra do Renan: VERDE = lançada · AMARELO = falta algo · AZUL = sugestão · AMARELO-CLARO = código lançado. */
const CONTRATO_NOME = "Educação";
const CONTRATO = {
  objeto:"SERVIÇO COMUM DE ENGENHARIA DE MANUTENÇÃO PREVENTIVA E CORRETIVA PREDIAL, COM ADEQUAÇÕES, ADAPTAÇÕES E MODERNIZAÇÕES, INCLUINDO OS PROJETOS E MATERIAIS NECESSÁRIOS, PARA AS DEMANDAS DOS IMÓVEIS PRÓPRIOS, UTILIZADOS PELA SECRETARIA MUNICIPAL DE EDUCAÇÃO, ESPORTE E LAZER - SEMEDE DO MUNICÍPIO DE RIO DAS OSTRAS - RJ.",
  secretaria:"SECRETARIA MUNICIPAL DE EDUCAÇÃO, ESPORTE E LAZER - SEMEDE", contrato:"Contrato 064/2025", firma:"F. P. VIEIRA ENGENHARIA LTDA",
};
const sb = window.supabase.createClient(window.FPV_CONFIG.url, window.FPV_CONFIG.anon, {auth:{persistSession:true,autoRefreshToken:true}});
const S = { email:"", medicoes:[], M:null, d:null, os:[], med:[], byId:{}, byRef:{}, idx:{}, base:[], byCod:{}, byItemId:{}, ordem:{}, jur:{},
  mos:[], lanc:[], dec:{}, estilos:{}, view:"medicao", filtro:"alancar", busca:{}, status:{}, sort:{}, lim:{}, todasCols:false, prob:"",
  relTodas:false, ficha:null, lista:[], voltaFoco:null, atual:null, gerando:false, salvando:false, carregadoEm:"" };
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = t => String(t??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const nf2 = new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const f2 = v => (v==null||isNaN(v))?"–":nf2.format(v);
const brl = v => (!v||isNaN(v))?"–":"R$ "+nf2.format(v);
const br = d => { if(!d) return ""; const m=String(d).slice(0,10).match(/^(\d{4})-(\d{2})-(\d{2})$/); return m?`${m[3]}/${m[2]}/${m[1]}`:String(d); };
const iso = d => String(d||"").slice(0,10);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),3200)}
function wireFocus(id,p){ if(!id)return; const el=document.getElementById(id); if(el){el.focus(); if(p!=null) try{el.setSelectionRange(p,p)}catch(e){}} }
/* fotos: miniatura feita pelo próprio servidor (imgproxy do Supabase) — 13 KB em vez de 270 KB */
const mini = (u,w) => String(u).includes("/storage/v1/object/public/") ? String(u).replace("/storage/v1/object/public/","/storage/v1/render/image/public/")+`?width=${w}&height=${w}&resize=contain&quality=${w>400?75:60}` : u;

/* ================= LOGIN ================= */
function telaLogin(msg){
  $("#topr").innerHTML=""; $("#sheets").innerHTML="";
  $("#app").innerHTML=`<form class="login" id="flogin">
    <h1>Entrar</h1><p class="sub">Use o mesmo login do app de campo.</p>
    ${msg?`<div class="notice erro">${esc(msg)}</div>`:""}
    <label for="lemail">Login</label><input class="in" id="lemail" autocomplete="username" placeholder="edmar ou edmar@fpv.app" required>
    <label for="lsenha">Senha</label><input class="in" id="lsenha" type="password" autocomplete="current-password" required>
    <div class="acts"><button class="btn pri" type="submit" id="lentrar">Entrar</button></div></form>`;
  $("#flogin").addEventListener("submit",async e=>{
    e.preventDefault(); const b=$("#lentrar"); b.disabled=true; b.textContent="Entrando…";
    let email=$("#lemail").value.trim().toLowerCase(); if(email&&!email.includes("@")) email+="@fpv.app";
    const {error}=await sb.auth.signInWithPassword({email,password:$("#lsenha").value});
    if(error){ telaLogin(error.message==="Invalid login credentials"?"Login ou senha errados.":"Não deu para entrar: "+error.message); return; }
    iniciar();
  });
  wireFocus("lemail");
}
async function sair(){ await sb.auth.signOut(); S.d=null; telaLogin(); }

/* ================= LEITURA DO BANCO ================= */
async function todas(tabela, colunas, filtro){
  let out=[], de=0;
  for(;;){
    let q=sb.from(tabela).select(colunas).order("id").range(de,de+999); if(filtro) q=filtro(q);
    const {data,error}=await q; if(error) throw new Error(`${tabela}: ${error.message}`);
    out=out.concat(data); if(data.length<1000) break; de+=1000;
  }
  return out;
}
async function iniciar(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ telaLogin(); return; }
  S.email=session.user.email||"";
  $("#app").innerHTML='<div class="empty">Lendo o banco…</div>';
  try{
    const {data:meds,error}=await sb.from("medicao").select("*").eq("contrato",CONTRATO_NOME).order("numero",{ascending:false});
    if(error) throw new Error("medicao: "+error.message);
    S.medicoes=meds||[];

      por:x.lancado_por||"", em:x.lancado_em||x.atualizado_em, resultado:x.resultado_fiscal||""};
  });
  const tipoDaOS={}; S.os.forEach(o=>{ if(o.ti) tipoDaOS[o.id]=o.ti; });
  const cont={}; S.mos.forEach(x=>{const t=tipoDaOS[x.os_id]; if(!t||x.situacao!=="lancada") return; (porMos[x.id]||[]).forEach(l=>{const b=S.byItemId[l.contrato_item_id]; if(!b) return; const k=slug(t); cont[k]=cont[k]||{tipo:t,c:{}}; cont[k].c[b.cod]=(cont[k].c[b.cod]||0)+1;})});
  // junta as duas fontes: o histórico das MED 01-09 e o que já foi lançado neste painel (o lançado vem primeiro)
  S.estilos={};
  (S.hist||[]).forEach(h=>{ S.estilos[slug(h.tipo)]={tipo:h.tipo, hist:h, usos:0, lanc:[], cods:h.cods.filter(c=>c.n_os>=Math.max(2,h.n_os*0.1)).slice(0,3).map(c=>c.cod)}; });

/* ================= fita de cálculo ================= */
function evalExpr(str){
  if(str==null||String(str).trim()==="") return NaN;
  let s=String(str).replace(/×/g,"x").replace(/÷/g,"/").replace(/,/g,".").replace(/[xX]/g,"*").replace(/[^0-9.+\-*\/()]/g,"");
  let i=0;const eat=c=>{if(s[i]===c){i++;return true}return false};
  function num(){let st=i;while(i<s.length&&/[0-9.]/.test(s[i]))i++;if(st===i)throw 0;return parseFloat(s.slice(st,i))}
  function fac(){if(eat("(")){const v=add();if(!eat(")"))throw 0;return v}if(eat("-"))return -fac();return num()}
  function mul(){let v=fac();for(;;){if(eat("*"))v*=fac();else if(eat("/"))v/=fac();else return v}}
  function add(){let v=mul();for(;;){if(eat("+"))v+=mul();else if(eat("-"))v-=mul();else return v}}
  try{const v=add();return i===s.length&&isFinite(v)?v:NaN}catch(e){return NaN}
}
function exprDaMemoria(o){ const c=String(o.mc||"").trim(); if(c&&/^[\s\d.,xX×*+\-()\/=]+$/.test(c)){const e=c.replace(/=.*$/,"").trim(); if(!isNaN(evalExpr(e))) return e;} return ""; }

/* ================= o motor (sugestão = azul) ================= */
const STOP=new Set(["de","da","do","das","dos","e","em","no","na","nos","nas","com","para","por","a","o","as","os","um","uma","que","ate","apos"]);
const toks = t => norm(t).split(/[^a-z0-9]+/).filter(w=>w.length>2&&!STOP.has(w));
const slug = t => norm(t).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"geral";
function codsDaSugestao(s){ const out=[]; let pre=""; for(const m of String(s||"").matchAll(/(\d{2}\.\d{3})(?:\.(\d{4}))?|\/(\d{4})\b/g)){ if(m[1]){pre=m[1];out.push(m[2]?pre+"."+m[2]:pre)} else if(m[3]&&pre) out.push(pre+"."+m[3]); } return out; }
function propostas(o){
  const codsSug=codsDaSugestao(o.cs), estilo=S.estilos[slug(o.ti)]||null, tx=new Set(toks((o.se||"")+" "+(o.so||"")+" "+(o.ti||"")));
  const cands=S.base.map(b=>{let sc=0; for(const w of toks(b.desc)) if(tx.has(w)) sc+=1.2; if(codsSug.some(c=>b.cod.startsWith(c))) sc+=6;
    if(estilo&&estilo.cods.includes(b.cod)) sc+=9; const j=S.jur[b.cod]; if(j&&sc>0) sc+=Math.log(1+j.n)*0.4; return {b,sc};})
    .filter(x=>x.sc>=2).sort((a,b)=>b.sc-a.sc).slice(0,4);
  return {cands, estilo};
}
function buscaItens(q){ const nq=norm(q); if(nq.length<2) return []; const ws=toks(q);
  return S.base.map(b=>{let sc=0;const nd=norm(b.desc);if(norm(b.cod).startsWith(nq))sc+=100;if(nd.includes(nq))sc+=10;for(const w of ws)if(nd.includes(w))sc+=2;return {b,sc}})
    .filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc||((S.jur[b.b.cod]||{}).n||0)-((S.jur[a.b.cod]||{}).n||0)).slice(0,8); }

function vaiPara(passo){ const ix=S.lista.indexOf(S.ficha.id), nx=S.lista[ix+passo]; if(nx==null){toast(passo>0?"Esta é a última O.S. da lista.":"Esta é a primeira O.S. da lista.");return} S.ficha={id:nx,draft:null}; $("#dw").scrollTop=0; renderFicha(); wireFocus(passo>0?"prox":"ant"); }

/* ================= GRAVAÇÃO NO BANCO ================= */
async function relerDecisoes(){
  const [mos,lanc]=await Promise.all([todas("medicao_os","*"),todas("medicao_lancamento","*")]);
  S.mos=mos; S.lanc=lanc; montaDecisoes();
}
async function decidir(o,status){
  if(S.salvando) return;
  const D=S.ficha.draft; let itens=[];
  if(status==="aprovada"){
    itens=D.itens.filter(i=>i.cod&&!isNaN(evalExpr(i.expressao))&&evalExpr(i.expressao)>0);
    if(!itens.length){toast("Preencha a conta de pelo menos um item antes de lançar.");return}
    const fora=itens.find(i=>!S.byCod[i.cod]); if(fora){toast(`O item ${fora.cod} não está no contrato.`);return}
  }
  const fr=[...D.fotos].sort((a,b)=>a-b).map(i=>o.ft[i]).filter(Boolean);
  S.salvando=true; renderFicha();
  try{
    const {data:row,error}=await sb.from("medicao_os").upsert({medicao_id:S.M.id,os_id:o.id,situacao:status==="aprovada"?"lancada":"pulada",
      fotos_relatorio:fr,legenda_relatorio:(D.legenda||"").trim()||null,lancado_por:S.email,lancado_em:new Date().toISOString()},{onConflict:"medicao_id,os_id"}).select().single();
    if(error) throw error;
    const {error:e2}=await sb.from("medicao_lancamento").delete().eq("medicao_os_id",row.id); if(e2) throw e2;
    if(itens.length){
      const {error:e3}=await sb.from("medicao_lancamento").insert(itens.map(i=>({medicao_os_id:row.id,contrato_item_id:S.byCod[i.cod].id,conta:String(i.expressao).trim(),quantidade:Math.round(evalExpr(i.expressao)*1e4)/1e4,lancado_por:S.email})));
      if(e3) throw e3;
    }
    await relerDecisoes();
    const d=decDe(o); toast(status==="aprovada"?`✓ O.S. ${o.os} lançada e gravada no banco (${brl(valorDec(d))}).`:`O.S. ${o.os} marcada como pulada.`);
    S.salvando=false;
    const ix=S.lista.indexOf(o.id), nx=S.lista[ix+1];
    if(nx!=null){S.ficha={id:nx,draft:null};$("#dw").scrollTop=0;renderFicha();wireFocus("prox")} else {S.ficha.draft=null;renderFicha();toast("Fim da lista deste filtro.")}
  }catch(e){ S.salvando=false; renderFicha(); toast("NÃO gravou: "+(e.message||e)); }
}
async function desfazer(o){
  const d=decDe(o); if(!d||S.salvando) return;
  S.salvando=true; renderFicha();
  try{ const {error}=await sb.from("medicao_os").delete().eq("id",d.mos); if(error) throw error; await relerDecisoes(); S.ficha.draft=null; toast("Lançamento desfeito (apagado do banco)."); }
  catch(e){ toast("Não deu para desfazer: "+(e.message||e)); }
  S.salvando=false; renderFicha();
}

    r.linhas.push({escola:o.un,os:o.os,expressao:it.expressao,qtd:it.qtd}); r.qtd+=it.qtd; }
  const its=[...porItem.values()].sort((a,b)=>(S.ordem[a.cod]??9e9)-(S.ordem[b.cod]??9e9)||a.cod.localeCompare(b.cod));

  for(let n=0;n<lista.length;n++){
    const o=lista[n], idx=fotosDoRelatorio(o); toast(`Montando o PDF: O.S. ${o.os} (${n+1} de ${lista.length})…`);
    const fotos=[]; for(const i of idx){ const f=await fotoVGA(o.ft[i]); if(f) fotos.push({i,...f}); else falhas++; }
    doc.setFontSize(9); const leg=doc.splitTextToSize(pdfTxt(legendaDe(o)),lw-4), cab=9+leg.length*4+5;
    if(y+cab+bh+8>base) novaPagina();
    doc.setFillColor(225,230,236); doc.rect(mx,y,lw,8,"F"); doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.text(pdfTxt(`O.S. ${o.os} - ${String(o.un).toUpperCase()}`),mx+2,y+5.6); y+=11;
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.text(leg,mx+2,y); y+=leg.length*4;
    doc.setFontSize(7.5); doc.setTextColor(100); doc.text(pdfTxt(`Executado por: ${o.ex||"-"}   ·   Conclusão: ${o.co||"-"}   ·   Fiscal: ${o.fi||"-"}`),mx+2,y+1); doc.setTextColor(0); y+=5;
    for(let k=0;k<fotos.length;k+=2){
      if(y+bh+7>base){ novaPagina(); doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.text(pdfTxt(`O.S. ${o.os} - ${String(o.un).toUpperCase()} (continuação)`),mx,y); doc.setFont("helvetica","normal"); y+=4; }
      for(let c=0;c<2&&k+c<fotos.length;c++){ const f=fotos[k+c], x=mx+c*(bw+gap); doc.setDrawColor(170); doc.rect(x,y,bw,bh);
        const r=Math.min((bw-2)/f.dm[0],(bh-2)/f.dm[1]), w=f.dm[0]*r, h=f.dm[1]*r; doc.addImage(f.src,"JPEG",x+(bw-w)/2,y+(bh-h)/2,w,h);
        doc.setFontSize(7.5); doc.text(pdfTxt(`Foto ${f.i+1} de ${o.ft.length} - O.S. ${o.os}`),x+bw/2,y+bh+3.6,{align:"center"}); }
      y+=bh+7;
    }
    y+=4;
  }
  const tot=doc.getNumberOfPages(); for(let p=1;p<=tot;p++){doc.setPage(p);doc.setFontSize(7.5);doc.setTextColor(120);doc.text(pdfTxt(`Página ${p} de ${tot}  ·  gerado pelo Painel do Medidor em ${new Date().toLocaleDateString("pt-BR")}`),Wp/2,Hp-7,{align:"center"});doc.setTextColor(0)}
  doc.save(`RELATORIO FOTOGRAFICO - ${medTag()} - EDUCACAO - ${hoje()}.pdf`);
  toast(falhas?`PDF salvo. ${falhas} foto(s) não abriram e ficaram de fora.`:"Relatório fotográfico salvo.");
}

/* ================= CONFERÊNCIA e abas de consulta ================= */
const tipoProb = p => String(p).replace(/\(.*|[0-9]+/g,"").replace(/\s+/g," ").trim();
function vConf(m){
  const R=Object.fromEntries(S.d.resumo), med=M().med, n=k=>R[k]??0, probs=S.d.problemas, tipos={};
  probs.forEach(p=>{const t=tipoProb(p[4]);tipos[t]=(tipos[t]||0)+1});
  const lista=S.prob?probs.filter(p=>tipoProb(p[4])===S.prob):probs, lanc=lancadas().length, valor=lancadas().reduce((a,[o,d])=>a+valorDec(d),0), futura=Object.entries(S.d.med_futura||{});
  const fig=(cls,v,t,k)=>`<button class="fig ${cls}" ${k?`data-go="${k}"`:""}><b class="num">${v}</b><span>${esc(t)}</span></button>`;
  m.innerHTML=`<h1>Conferência da ${esc(med)} (${esc(M().ini.slice(0,5))} a ${esc(M().fim.slice(0,5))})</h1>${fonteHTML()}
  <div class="figs">${fig("",S.med.length,"O.S. na medição","medicao")}${fig("ok",lanc,"lançadas pelo medidor","medicao")}${fig("ok",n("   ... PRONTAS P/ APRESENTAR (nº + memória + 3 fotos + executor)"),"prontas (com nº)","medicao")}
    ${fig("at",n("   ... COMPLETAR ANTES (risco de glosa)"),"completar antes","medicao")}${fig("",n(`${med} SEM Nº (fictícias feitas, sem nº oficial)`),"feitas sem nº oficial","medicao")}${fig("ok",valor?brl(valor):"–","valor lançado","memoria")}</div>
  ${futura.length?`<div class="notice"><b>Atenção:</b> O.S. marcadas em medição FUTURA: ${futura.map(([k,v])=>esc(k)+" ("+v+")").join(", ")}.</div>`:""}
  <section class="panel"><h2>Resumo (como a aba CONFERÊNCIA da Mestra)</h2><div class="tw" style="max-height:none"><table><tbody>${S.d.resumo.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n"><b>${esc(v)}</b></td></tr>`).join("")}</tbody></table></div>
    <p class="hint" style="margin-top:6px">A trava anti-medição dupla usa o resultado da fiscalização gravado no banco (medicao_os). As listas antigas das MED 8–10 ainda não foram importadas.</p></section>
  <section class="panel"><h2>Itens de conferência (${probs.length})</h2><div class="chips"><button class="chip ${S.prob?"":"on"}" data-p="">Todos (${probs.length})</button>${Object.entries(tipos).sort((a,b)=>b[1]-a[1]).map(([t,c])=>`<button class="chip ${S.prob===t?"on":""}" data-p="${esc(t)}">${esc(t.toLowerCase())} (${c})</button>`).join("")}</div>
    ${tabelaSimples(["ABA","OS","UNIDADE","EXECUTOR","PROBLEMA","O QUE FAZER"],lista,1)}</section>
  <section class="panel"><h2>O.S. emitidas no período ainda sem baixa (${S.d.emitidas_sem_baixa.length})</h2><p class="hint">Não entram na ${esc(med)} enquanto não forem concluídas.</p>${tabelaSimples(["STATUS","OS","UNIDADE","FISCAL","O QUE O FISCAL SOLICITOU"],S.d.emitidas_sem_baixa,1)}</section>
  <section class="panel"><h2>Serviços "Executando" sem número (${S.d.executando_sem_numero.length})</h2>${tabelaSimples(["STATUS","OS","UNIDADE","EXECUTOR","O QUE O FISCAL SOLICITOU"],S.d.executando_sem_numero,1)}</section>`;
  m.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{location.hash=b.dataset.go}));
  m.querySelectorAll("[data-p]").forEach(b=>b.addEventListener("click",()=>{S.prob=b.dataset.p;draw()}));
  ligaLinhas(m); S.atual={tipo:"arr",nome:"CONFERENCIA",cab:["ABA","OS","UNIDADE","EXECUTOR","PROBLEMA","O QUE FAZER"],linhas:lista,antes:S.d.resumo};
}
function tabelaSimples(cab,linhas,colRef){
  if(!linhas.length) return '<div class="empty">Nada aqui.</div>';
  return `<div class="tw"><table class="grid"><thead><tr>${cab.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${linhas.map(l=>{const o=S.byRef[String(l[colRef])];
    return `<tr ${o?`data-id="${o.id}"`:""}>${l.map((v,i)=>i===colRef?`<td>${o?`<button class="lnk" data-id="${o.id}">${esc(v)}</button>`:esc(v)}</td>`:cab[i]==="STATUS"?`<td>${tagStatus(v)}</td>`:`<td><div class="${String(v).length>60?"lt":""}">${esc(v)}</div></td>`).join("")}</tr>`}).join("")}</tbody></table></div>`;
}
const COLS=[["os","OS",1],["un","UNIDADE",1],["fi","FISCAL",0],["cl","CLASSIF",0],["en","ENTRADA",0],["co","CONCLUSÃO",1],["ex","RESPONSÁVEL",1],["st","STATUS",1],["me","MEDIÇÃO",1],
  ["so","O QUE O FISCAL SOLICITOU",0],["se","SERVIÇO EXECUTADO",1],["ma","MATERIAL (MANUAL)",0],["al","MATERIAL ALMOXARIFADO (AUTO)",0],["qi","QTDE ITENS",0],["mc","MEMÓRIA DE CÁLCULO",1],["_fotos","FOTOS",1],["as","ASSINADA",0],["va","VALIDAÇÃO ESCOLA",0]];
const LONGAS=new Set(["so","se","ma","al","mc","va"]);
const val=(o,k)=>k==="_fotos"?o.ft.length:(o[k]??"");
function vTabela(m,sh){
  const all=S.os.filter(sh.f), q=norm(S.busca[sh.k]||""), st=S.status[sh.k]||"", lim=S.lim[sh.k]||150;
  const rows=ordena(all.filter(o=>(!st||o.st===st)&&(!q||S.idx[o.id].includes(q))),sh.k,val), cols=S.todasCols?COLS:COLS.filter(c=>c[2]), so=S.sort[sh.k], sts=[...new Set(all.map(o=>o.st).filter(Boolean))].sort();
  m.innerHTML=`<h1>${esc(subst(sh.t))}</h1><p class="sub">${esc(subst(sh.tit))}</p>${fonteHTML()}
  <div class="bar"><input class="in" id="busca" type="search" placeholder="Buscar nº, escola, serviço, equipe…" value="${esc(S.busca[sh.k]||"")}" aria-label="Buscar nesta aba">
    <select class="in" id="fst" aria-label="Filtrar por status"><option value="">Todos os status (${all.length})</option>${sts.map(s=>`<option value="${esc(s)}" ${st===s?"selected":""}>${esc(s)} (${all.filter(o=>o.st===s).length})</option>`).join("")}</select>
    <label class="chk"><input type="checkbox" id="tcols" ${S.todasCols?"checked":""}> todas as colunas</label></div>
  <p class="hint num">${rows.length===all.length?all.length:`${rows.length} de ${all.length}`} O.S. · clique na linha para ver a ficha e as fotos</p>
  ${rows.length?`<div class="tw"><table class="grid"><thead><tr>${cols.map(c=>`<th class="so" data-s="${c[0]}" aria-sort="${so&&so.k===c[0]?(so.d>0?"ascending":"descending"):"none"}">${esc(c[1])}${so&&so.k===c[0]?(so.d>0?" ▲":" ▼"):""}</th>`).join("")}</tr></thead><tbody>
  ${rows.slice(0,lim).map(o=>`<tr data-id="${o.id}">${cols.map(([k])=>{const v=val(o,k);return k==="os"?`<td><button class="lnk" data-id="${o.id}">${esc(v)}</button></td>`:k==="st"?`<td>${tagStatus(v)}</td>`:k==="_fotos"?`<td class="n ${v<3?"falta":""}">${v}</td>`:`<td><div class="${LONGAS.has(k)?"lt":k==="un"?"md":""}">${esc(v)}</div></td>`}).join("")}</tr>`).join("")}</tbody></table></div>`:'<div class="empty">Nenhuma O.S. com esse filtro.</div>'}
  ${rows.length>lim?`<div class="acts"><button class="btn" id="mais">Mostrar mais ${Math.min(300,rows.length-lim)}</button><span class="hint num">faltam ${rows.length-lim}</span></div>`:""}`;
  const b=$("#busca"); b.addEventListener("input",()=>{S.busca[sh.k]=b.value;clearTimeout(vTabela._t);vTabela._t=setTimeout(()=>{const p=b.selectionStart;S.lim[sh.k]=150;draw();wireFocus("busca",p)},220)});
  $("#fst").addEventListener("change",e=>{S.status[sh.k]=e.target.value;S.lim[sh.k]=150;draw()}); $("#tcols").addEventListener("change",e=>{S.todasCols=e.target.checked;draw()});
  m.querySelectorAll("th.so").forEach(th=>th.addEventListener("click",()=>{const k=th.dataset.s,c=S.sort[sh.k];S.sort[sh.k]=c&&c.k===k?(c.d>0?{k,d:-1}:null):{k,d:1};draw()}));
  const mais=$("#mais"); if(mais) mais.addEventListener("click",()=>{S.lim[sh.k]=lim+300;draw()});
  ligaLinhas(m); S.atual={tipo:"arr",nome:subst(sh.t),cab:[...COLS.map(c=>c[1]),"LINKS DAS FOTOS"],linhas:rows.map(o=>[...COLS.map(([k])=>val(o,k)),o.ft.join(" | ")])};
}
function vVinc(m){
  const lista=S.os.filter(o=>o.ab.includes("vinc")).sort((a,b)=>String(a.pr).localeCompare(String(b.pr),"pt-BR",{numeric:true})), linhas=lista.map(o=>[o.fr||o.os,o.pr||"",o.un,o.ex,o.se]);
  m.innerHTML=`<h1>Vinculadas</h1><p class="sub">EMERGÊNCIAS VINCULADAS — fictícia oficializada na O.S. oficial (regra do # N:1)</p>${fonteHTML()}${tabelaSimples(["FICTÍCIA","VINCULADA À OFICIAL","UNIDADE","EXECUTOR","SERVIÇO DA EMERGÊNCIA"],linhas,0)}`;
  ligaLinhas(m); S.atual={tipo:"arr",nome:"VINCULADAS",cab:["FICTICIA","VINCULADA A OFICIAL","UNIDADE","EXECUTOR","SERVICO DA EMERGENCIA"],linhas};
}
function vEstilos(m){
  const es=Object.values(S.estilos).sort((a,b)=>(b.usos-a.usos)||((b.hist?b.hist.n_os:0)-(a.hist?a.hist.n_os:0)));
  const desc=c=>{const b=S.byCod[c];return b?b.desc.slice(0,70):""};
  m.innerHTML=`<h1>Estilos aprendidos</h1><p class="sub">Para cada tipo de serviço, os itens EMOP que a fiscalização <b>aceitou nas MED 01 a 09</b> (memória de cálculo aprovada, ligada ao serviço de cada O.S.) e o que o medidor já <b>lançou neste painel</b>. Os itens marcados viram a primeira sugestão nas O.S. do mesmo tipo — é sugestão (azul); vale o que o medidor lançar.</p>
  <section class="panel"><div class="tw" style="max-height:none"><table><thead><tr><th>Tipo de serviço</th><th>Itens mais aceitos no histórico (% das O.S. do tipo)</th><th class="n">O.S. no histórico</th><th>Lançados no painel</th></tr></thead><tbody>
  ${es.map(e=>`<tr><td><b>${esc(e.tipo)}</b><div class="hint" style="margin:2px 0 0">sugere: ${esc(e.cods.join(" · "))}</div></td>
    <td>${e.hist?e.hist.cods.map(c=>`<div><span class="num"><b>${esc(c.cod)}</b> · ${Math.round(100*c.n_os/e.hist.n_os)}%</span> <span class="hint">${esc(desc(c.cod))}</span></div>`).join(""):'<span class="vazio">—</span>'}</td>
    <td class="n">${e.hist?e.hist.n_os:"–"}</td><td class="num">${e.usos?`${e.usos} · ${esc(e.lanc.slice(0,3).join(" · "))}`:'<span class="vazio">—</span>'}</td></tr>`).join("")||'<tr><td colspan="4" class="empty">Nada aprendido ainda.</td></tr>'}</tbody></table></div>
  <p class="hint" style="margin-top:8px">Fonte do histórico: ${esc(String((S.hist||[]).length))} tipos, a partir das linhas de memória aceitas das MED 01–09 que trazem o nº da O.S. (as que trazem só o local ficam de fora).</p></section>`;
}

/* ================= botão do topo ================= */
async function acaoTopo(){
  const A=S.atual; if(!A) return;
  try{
    if(A.tipo==="relatorio"){ S.gerando=true; draw(); await geraRelatorio(); S.gerando=false; draw(); return; }
    if(A.tipo==="memoria"){ if(!A.its.length){toast("Nenhuma O.S. lançada ainda.");return} exportaMemoria(); toast("Memória de cálculo baixada."); return; }
    let wb, nome;
    if(A.tipo==="medicao"){
      const cab=["OS","UNIDADE","CONCLUSAO","RESPONSAVEL","SERVICO EXECUTADO","MEMORIA DO CAMPO","FOTOS","O QUE FALTA","TIPO (SUGESTAO)","CODIGO (SUGESTAO)","CODIGO LANCADO","QTD / CONTA","VALOR","SITUACAO"];
      const linhas=A.rows.map(o=>{const d=decDe(o),st=statusDe(o);return [o.os,o.un,o.co,o.ex,o.se,o.mc,o.ft.length,faltaDe(o).join(", "),o.ti,o.cs,st==="aprovada"?d.itens.map(i=>i.cod).join(" + "):"",st==="aprovada"?d.itens.map(i=>`${i.expressao} = ${i.qtd} ${i.unid}`).join(" | "):"",st==="aprovada"?Math.round(valorDec(d)*100)/100:"",st==="aprovada"?"LANÇADA":st==="pulada"?"PULADA":"A LANÇAR"]});
      wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([[`PAINEL DO MEDIDOR — ${M().med} (${M().ini} a ${M().fim})`],[`Gerado em ${new Date().toLocaleString("pt-BR")} · banco lido em ${S.carregadoEm}`],[],cab,...linhas]),M().med);
      nome=`MEDICAO ${medTag()} - lista do medidor - ${hoje()}.xlsx`;
    } else {
      const aoa=[[`PLANILHA MESTRA FP.094 — ${A.nome}`],[`Banco lido em ${S.carregadoEm} (painel do medidor)`],[],...(A.antes?[...A.antes,[]]:[]),A.cab,...A.linhas];
      wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),String(A.nome).replace(/[\\\/?*\[\]:]/g,"-").slice(0,31));
      nome=`MESTRA ${medTag()} - ${String(A.nome).replace(/[\\\/?*\[\]:"<>|]/g,"-")} - ${hoje()}.xlsx`;
    }
    XLSX.writeFile(wb,nome); toast("Planilha baixada.");
  }catch(e){ S.gerando=false; draw(); toast("Não foi possível gerar agora: "+(e.message||e)); }
}

/* ================= começo ================= */
sb.auth.onAuthStateChange(ev=>{ if(ev==="SIGNED_OUT"){ S.d=null; telaLogin(); } });
iniciar();
</script>
